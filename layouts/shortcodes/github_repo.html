{{ $url := .Get "url" }} {{ $parts := split $url "/" }} {{ $owner := index
$parts 3 }} {{ $repo := index $parts 4 }}

<a
  href="{{ $url }}"
  target="_blank"
  rel="noopener noreferrer"
  class="github-repo block rounded-lg p-5 my-8 border border-gray-600 hover:border-accent transition-colors"
>
  <div class="flex items-center gap-3">
    <span class="inline-flex shrink-0 text-2xl text-gray-300">
      {{ partial "icon.html" (dict "name" "github") }}
    </span>
    <div>
      <span class="font-sans font-bold text-accent"
        >{{ $owner }}/{{ $repo }}</span
      >
      {{ with $.Get "description" }}
      <p class="text-gray-300 text-sm mt-1">{{ . }}</p>
      {{ end }}
    </div>
  </div>
</a>
