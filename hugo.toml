baseURL = "https://snptrs.dev/"
title = "Sean Peters"
languageCode = "en"
# Hugo title-cases auto-generated page titles by default, which turns the "ai"
# tag into "Ai". "none" keeps tag names exactly as written in front matter.
# Section and taxonomy list pages lose their auto-capitalisation too, hence the
# _index.md files under content/posts/ and content/tags/.
titleCaseStyle = "none"
[pagination]
pagerSize = 15

[taxonomies]
tag = "tags"

[permalinks]
[permalinks.page]
posts = "/:contentbasename/"

[markup]
[markup.goldmark]
[markup.goldmark.extensions]
footnote = true
[markup.goldmark.extensions.typographer]
disable = false
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
style = "nord"
noClasses = true

[outputFormats]
[outputFormats.RSS]
baseName = "feed"

[outputs]
home = ["HTML", "RSS", "Sitemap"]
section = ["HTML", "RSS", "Sitemap"]

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = "assets/notwatching/hugo_stats\\.json"
target = "css"

[module]
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
disableWatch = true
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"

[imaging]
quality = 85
resampleFilter = "lanczos"

[params]
author = "Sean Peters"
profilePhoto = "images/profile-photo.jpeg"
